[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binaiui-runtime"
version = "0.2.0"
description = "Portable resumable Ram/Opal runtime grounded in BINAIUI source lineage"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
binaiui = "binaiui_runtime.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
